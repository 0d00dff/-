name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 使用 runner 预装的 Android SDK，不再调用 setup-android
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f gradlew ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "type=android" >> $GITHUB_OUTPUT
          elif grep -qs '"react-native"' package.json; then
            echo "type=react-native" >> $GITHUB_OUTPUT
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
          fi
          echo "### 仓库根目录" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -A >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Set up JDK 17
        if: steps.detect.outputs.type != 'unknown'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK (预装)
        if: steps.detect.outputs.type == 'android' || steps.detect.outputs.type == 'react-native'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        if: steps.detect.outputs.type == 'android' || steps.detect.outputs.type == 'react-native'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------- 原生 Gradle 项目 ----------
      - name: Build (Gradle)
        if: steps.detect.outputs.type == 'android'
        run: |
          GRADLE=./gradlew
          [ -f ./gradlew ] || GRADLE=gradle
          [ -f ./gradlew ] && chmod +x ./gradlew
          $GRADLE --version
          $GRADLE assembleDebug --stacktrace --no-daemon

      # ---------- Flutter ----------
      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        run: |
          flutter pub get
          flutter build apk --release

      # ---------- React Native ----------
      - name: Set up Node
        if: steps.detect.outputs.type == 'react-native'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build (React Native)
        if: steps.detect.outputs.type == 'react-native'
        run: |
          npm ci || npm install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Unsupported project
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "::error::没识别到安卓项目结构，请看 Summary 里的根目录文件列表"
          exit 1

      # ---------- 收集 + 上传 APK ----------
      - name: Collect APKs
        run: |
          mkdir -p out
          shopt -s globstar nullglob
          for f in **/build/**/outputs/**/*.apk **/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "out/$(basename "$f" .apk)-${GITHUB_SHA::7}.apk"
          done
          ls -lh out
          test -n "$(ls -A out)" || { echo "::error::构建成功但没有找到 APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
